name: eloquente_text
description: >-
  Melhora textos com IA a partir de um atalho global, em qualquer aplicativo
  do Windows ou do Linux. Roda localmente, com a sua própria API key.
repository: https://github.com/valdirgiorgi/eloquente_text
# Aplicativo, não um pacote: impede a publicação acidental no pub.dev.
publish_to: 'none'

# <versão>+<build>. Usada no nome do executável gerado por `flutter build`.
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Janela, bandeja do sistema, atalho global e área de transferência
  window_manager: ^0.3.9
  hotkey_manager: ^0.2.3
  tray_manager: ^0.2.2
  clipboard: ^0.1.3

  # Chamadas às APIs de IA, banco local e criptografia das API keys
  http: ^1.2.0
  sqflite_common_ffi: ^2.3.2
  sqlite3_flutter_libs: ^0.5.18
  path: ^1.9.0
  path_provider: ^2.1.2
  encrypt: ^5.0.3

  # Interface
  fluent_ui: ^4.0.0
  system_theme: ^3.0.0
  google_fonts: ^6.1.0
  fl_chart: ^0.66.0
  intl: ^0.20.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icon/
